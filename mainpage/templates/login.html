{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | Brawlhalla Forum</title>

    <link rel="stylesheet" href="{% static 'mainpage/css/geak.css' %}">
    <link rel="stylesheet" href="{% static 'mainpage/css/login.css' %}">


</head>
<body>

<div class="login-wrapper">

    <div class="login-box">

        <h2 class="login-title">⚔️ Вхід</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="login-btn">
                Увійти
            </button>

        </form>

        {% if error %}
            <p class="error-text">{{ error }}</p>
        {% endif %}

        <div class="register-link">
            <a href="{% url 'register' %}">
                Немає акаунта? Зареєструватися
            </a>
        </div>

    </div>

</div>

</body>
</html>
