{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'mainpage/css/post.css' %}">

<div class="create-post-page">

    <div class="post-header">
        <h1>Создание поста</h1>
        <p>Создай новую тему для игроков Brawlhalla</p>
    </div>

    <form method="POST" class="post-form">
        {% csrf_token %}

        <div class="form-box">
            <label>Название темы</label>
            <input type="text"
                   name="title"
                   placeholder="Например: Лучший hammer player?"
                   required>
        </div>

        <div class="form-box">
            <label>Категория</label>

            <select name="category">
                <option>Обсуждение</option>
                <option>Ranked</option>
                <option>Мемы</option>
                <option>Турниры</option>
                <option>Гайды</option>
                <option>Кланы</option>
            </select>
        </div>

        <div class="form-box">
            <label>Текст поста</label>

            <textarea name="content"
                      rows="10"
                      placeholder="Напиши что-нибудь для игроков Brawlhalla..."
                      required></textarea>
        </div>

        <div class="buttons">

            <button type="submit" class="publish-btn">
                🚀 Опубликовать
            </button>

            <button type="reset" class="reset-btn">
                ❌ Очистить
            </button>

        </div>

    </form>

</div>

{% endblock %}
